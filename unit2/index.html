<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 2 Study Guide — Chapters 4–6</title>
</head>
<body>
<script>
(async () => {
  const chapters = {
    4: {
      subtitle: "Physical development, health, motor skills",
      cards: [
        ["Infant weight gain","Birth weight typically doubles by about 4 months and triples by about age 1.","By about age 2, birth weight is typically about four times its original amount.","An infant who weighed 7 pounds at birth would be expected to weigh roughly 21 pounds around the first birthday."],
        ["Synaptic pruning","Connections that are used become stronger, while many unused neural connections are eliminated.","","A neural pathway that is rarely activated becomes less likely to remain as the brain becomes more efficient."],
        ["Myelination","The development of a fatty myelin coating around axons that allows neural messages to travel faster and more efficiently.","","As more axons become myelinated, communication among parts of the nervous system becomes quicker and more coordinated."],
        ["Rooting reflex","A newborn turns toward stimulation of the cheek, helping the infant locate food.","","When a caregiver strokes a newborn’s cheek, the baby turns the head toward the touch."],
        ["Moro reflex","A startle response in which a newborn spreads the arms and legs and then pulls them inward.","","A sudden loud noise causes a newborn to fling the arms outward and then bring them back toward the body."],
        ["Gross motor skills","Large-body movements that use major muscle groups.","Examples include holding the head steady, walking, running, and kicking a ball.","A toddler walking independently across a room is using a gross motor skill."],
        ["Pincer grasp","A fine motor grasp using the thumb and index finger to pick up small objects.","","An infant picks up a small piece of cereal between the thumb and index finger."],
        ["Visual acuity","Young infants have immature visual acuity, but vision becomes much clearer across the first months of life.","By about 6 months, acuity is close to adult 20/25 vision.","High-contrast patterns are easier for a young infant to see than low-contrast details."],
        ["Hearing","Hearing develops before birth, and newborns often prefer familiar human voices and sounds heard prenatally.","","A newborn turns toward the sound of a familiar caregiver’s voice."],
        ["Readiness for solid foods","Most infants can begin solid foods at about 6 months when they show signs such as good head control and interest in offered food.","","An infant who sits with support, controls the head well, and leans toward a spoon is showing readiness cues."],
        ["Breast milk and antibodies","Breast milk contains antibodies that help protect infants from infection.","Breastfeeding is associated with lower risk of some ear and respiratory infections.","A health benefit of breast milk is that it supplies immune protection in addition to nutrition."],
        ["Milk anemia","Iron deficiency that can occur when a toddler drinks so much cow’s milk that it replaces iron-rich foods.","","A toddler fills up on milk throughout the day and eats very few foods that provide iron."],
        ["Safe infant sleep","Place infants on their backs on a firm, uncluttered sleep surface.","Loose bedding, pillows, stuffed animals, and soft sleep surfaces should not be in the sleep area.","A crib contains a firm mattress and fitted sheet, with the infant placed on the back and no loose blankets or pillows."],
        ["Vaccination","Vaccines help the immune system recognize and respond to specific diseases.","Immunization can also reduce the spread of preventable disease through a community.","After vaccination, the immune system is better prepared to respond if it later encounters the disease."]
      ]
    },
    5: {
      subtitle: "Cognitive development, learning, language, memory",
      cards: [
        ["Primary circular reaction","A repeated action centered on the infant’s own body because the action itself is interesting or pleasurable.","","A 3-month-old accidentally makes an interesting sound and repeats it for the pleasure of the activity."],
        ["Secondary circular reaction","A repeated action directed toward an object or event in the outside world.","","A 6-month-old repeatedly shakes a rattle to reproduce an interesting sound."],
        ["Tertiary circular reaction","An infant actively varies actions to discover what happens, behaving like a “little scientist.”","","A 14-month-old drops a spoon from different heights to see how the outcome changes."],
        ["Object permanence","The understanding that an object continues to exist even when it cannot be seen.","","An infant watches a toy being covered and then lifts the cloth to find it."],
        ["A-not-B error","An infant searches for an object in a previously successful hiding place even after watching it move to a new location.","","After finding a toy several times under cloth A, an infant watches it being hidden under cloth B but still searches under A."],
        ["Vygotsky and social interaction","Cognitive development is strongly supported through interaction with more experienced adults and peers.","Learning is often scaffolded: support is adjusted as the child becomes more capable.","An adult first guides a toddler through a puzzle and then gradually reduces help."],
        ["Babbling","Repeated consonant-vowel combinations that do not yet carry a fixed word meaning.","","An infant repeatedly produces sounds such as “ba-ba-ba.”"],
        ["Holophrase","A single word used to communicate the meaning of an entire sentence or idea.","","A toddler says “Up!” to mean “Pick me up.”"],
        ["Telegraphic speech","Brief speech that contains the main meaning while leaving out smaller grammatical words.","","A toddler says “Mommy go” or “want cookie.”"],
        ["Chomsky’s language acquisition device","The proposal that children are biologically prepared for language through an inborn language-learning system.","","A child produces sentences they have never heard exactly before, suggesting more than simple imitation."],
        ["Classical conditioning","Learning through repeated pairing, so a previously neutral stimulus comes to trigger a response.","","A baby begins to feel calm when a lullaby has repeatedly been paired with feeding and comfort."],
        ["Negative reinforcement","A behavior becomes more likely because it removes or stops something unpleasant.","“Negative” means something is removed; “reinforcement” means the behavior increases.","A car’s irritating alarm stops when a parent fastens the seat belt, making quick buckling more likely in the future."],
        ["Episodic memory","Conscious memory for personal events and experiences, including where and when they happened.","","An adult consciously recalls details of a child’s first birthday party."]
      ]
    },
    6: {
      subtitle: "Socioemotional development, temperament, attachment, care",
      cards: [
        ["Difficult temperament","More intense negative reactions, less regularity, and greater difficulty adapting to change.","","A baby reacts strongly to new routines, cries frequently, and adjusts poorly to change."],
        ["Slow-to-warm-up temperament","Initial withdrawal or caution in new situations followed by gradual adjustment.","Supportive caregivers give advance warning and time to adjust rather than forcing immediate participation.","A toddler watches quietly at a new playgroup and joins in only after becoming familiar with the setting."],
        ["Goodness-of-fit","A good match between a child’s temperament and the expectations, routines, and support in the environment.","","Parents recognize that a highly active toddler needs safe opportunities to move and adjust routines accordingly."],
        ["Bidirectional influence","Parents influence children, and children’s characteristics and behavior also influence parents.","","A fussy infant affects how patient the parents feel, while the parents’ responses also affect the infant."],
        ["Social smile","A smile that occurs in response to another person, commonly emerging at about 2 months.","","An infant smiles when a familiar caregiver talks and smiles at them."],
        ["Separation anxiety","Distress when a familiar caregiver leaves.","","A 10-month-old cries when a parent leaves the room."],
        ["Social referencing","Using another person’s emotional expression to guide how to respond in an uncertain situation.","","Before crawling across an unfamiliar surface, an infant looks at a caregiver’s face to decide what to do."],
        ["Contact comfort","The importance of physical closeness, softness, and touch in attachment.","Harlow’s monkeys preferred a warm cloth surrogate even when a wire surrogate provided food.","The preference for the cloth surrogate showed that feeding alone could not explain attachment."],
        ["Secure attachment","The child uses the caregiver as a secure base for exploration and is comforted by the caregiver at reunion.","","In the Strange Situation, a child explores while the caregiver is present, becomes upset at separation, and settles after reunion."],
        ["Resistant attachment","The child becomes highly distressed by separation and both seeks and resists comfort at reunion.","","A child clings to the caregiver but angrily pushes away or resists soothing when the caregiver returns."],
        ["Avoidant attachment","The child shows little visible distress at separation and avoids or ignores the caregiver at reunion.","","A child shows little emotion when the caregiver leaves and turns away after the caregiver returns."],
        ["Erikson: trust vs. mistrust","Sensitive and reliable care during infancy supports the development of a basic sense of trust.","","An infant repeatedly experiences caregivers as dependable sources of food, comfort, and stimulation."],
        ["Formal child care","Center-based care takes place in a dedicated facility; a family child care home is a small formal program operated in a provider’s residence.","","A licensed center serves groups of children in classrooms, while a family child care provider cares for a smaller group at home."]
      ]
    }
  };

  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const cardHTML = ([term,def,mini,ex]) => `<article class="card"><div class="card-top"><div class="term">${esc(term)}</div><button class="mark" aria-label="Mark known">✓</button></div><div class="definition">${esc(def)}</div>${mini ? `<div class="mini">${esc(mini)}</div>` : ''}<div class="recall-label">Tap card to reveal</div><button class="example-toggle"><span class="show">Example</span><span class="hide">Hide example</span></button><div class="example">${esc(ex)}</div></article>`;
  const main = Object.entries(chapters).map(([n,ch]) => `<section data-chapter="${n}"><div class="section-head"><h2>Chapter ${n}</h2><div class="section-count">${esc(ch.subtitle)}</div></div><div class="grid">${ch.cards.map(cardHTML).join('')}</div></section>`).join('');

  let html = await fetch('../index.html', {cache:'no-store'}).then(r => r.text());
  html = html.replace(/<title>[^<]*<\/title>/, '<title>Unit 2 Study Guide — Chapters 4–6</title>');
  html = html.replace('<h1>Exam 1 Study Guide</h1>', '<h1>Unit 2 Study Guide</h1>');
  html = html.replace('<div class="sub">Chapters 1–3</div>', '<div class="sub">Chapters 4–6</div>');
  html = html.replace('<button class="chip" data-filter="1">Chapter 1</button>', '<button class="chip" data-filter="4">Chapter 4</button>');
  html = html.replace('<button class="chip" data-filter="2">Chapter 2</button>', '<button class="chip" data-filter="5">Chapter 5</button>');
  html = html.replace('<button class="chip" data-filter="3">Chapter 3</button>', '<button class="chip" data-filter="6">Chapter 6</button>');
  html = html.replace(/<main class="wrap" id="guide">[\s\S]*?<\/main>/, '<main class="wrap" id="guide">' + main + '</main>');
  document.open();
  document.write(html);
  document.close();
})().catch(err => {
  document.body.innerHTML = '<p style="font-family:system-ui;padding:24px">The study guide could not load. Please refresh the page.</p>';
  console.error(err);
});
</script>
</body>
</html>
